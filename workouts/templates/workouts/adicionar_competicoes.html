<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hyrox Planner - Salvar Competição</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Font: Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            color: #ffffff;
            
            /* Fundo Animado no tom Violeta/Azul para a área de Competições */
            background: linear-gradient(-45deg, #0f172a, #2e1065, #1e1b4b, #134e4a, #3b0764);
            background-size: 400% 400%;
            animation: backgroundGradient 12s ease infinite;
        }

        @keyframes backgroundGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Navbar Escura Transparente */
        .navbar-custom {
            background-color: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Card Principal Estilo Glassmorphism */
        .main-container-card {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(16px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 2.5rem;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            max-width: 650px;
            margin: 0 auto;
        }

        /* Formatação de todos os inputs do formulário do Django */
        .main-container-card input, 
        .main-container-card select, 
        .main-container-card textarea {
            background-color: rgba(30, 41, 59, 0.7) !important;
            border: 1px solid rgba(168, 85, 247, 0.3) !important;
            color: #ffffff !important;
            border-radius: 10px !important;
            padding: 10px 15px !important;
            margin-bottom: 15px;
            width: 100%;
        }

        .main-container-card input:focus, 
        .main-container-card select:focus, 
        .main-container-card textarea:focus {
            border-color: rgba(168, 85, 247, 0.8) !important;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.35) !important;
            outline: none;
        }

        .main-container-card label {
            font-weight: 500;
            margin-bottom: 6px;
            color: #e9d5ff;
        }

        /* Botão Principal de Salvar */
        .btn-salvar {
            background-color: #a855f7;
            color: #ffffff;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            padding: 10px 24px;
            box-shadow: 0 4px 14px rgba(168, 85, 247, 0.4);
            transition: all 0.2s;
        }
        .btn-salvar:hover {
            background-color: #9333ea;
            color: #ffffff;
            transform: scale(1.02);
        }

        /* Botão de Cancelar */
        .btn-cancelar {
            background-color: rgba(148, 163, 184, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #cbd5e1;
            font-weight: 500;
            border-radius: 10px;
            padding: 10px 24px;
            text-decoration: none;
            transition: all 0.2s;
        }
        .btn-cancelar:hover {
            background-color: rgba(148, 163, 184, 0.4);
            color: #ffffff;
        }
    </style>
</head>
<body>

    <!-- Navegação Superior -->
    <nav class="navbar navbar-dark navbar-custom mb-5 py-3">
        <div class="container">
            <span class="navbar-brand mb-0 h1 fw-bold fs-4">⚡ Hyrox Planner</span>
            <div>
                <a href="/treinos/" class="btn btn-outline-light btn-sm me-2 rounded-pill px-3">Treinos</a>
                <a href="/treinos/competicoes/" class="btn btn-outline-light btn-sm rounded-pill px-3 active">Competições</a>
            </div>
        </div>
    </nav>

    <div class="container mb-5">
        <div class="main-container-card">
            <h2 class="fw-bold fs-3 mb-4 text-white">🏆 Dados da Competição</h2>
            
            <form method="POST">
                {% csrf_token %}
                {{ form.as_p }}
                
                <div class="d-flex justify-content-end gap-3 mt-4">
                    <a href="/treinos/competicoes/" class="btn btn-cancelar">Cancelar</a>
                    <button type="submit" class="btn btn-salvar">Salvar Competição</button>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
